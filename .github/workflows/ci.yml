name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: houston
          POSTGRES_USER: houston
          POSTGRES_PASSWORD: houston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U houston -d houston"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ci.example.test,localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: https://ci.example.test
      HOUSTON_AUTH_TOKEN_PEPPER: ci-auth-token-pepper-distinct
      HOUSTON_AUTH_TOKEN_SALT: ci-auth-token-salt
      HOUSTON_CHAT_WS_TICKET_SALT: ci-chat-ws-ticket-salt
      HOUSTON_REALTIME_WS_TICKET_SALT: ci-realtime-ws-ticket-salt
      OPENAI_API_KEY: sk-ci-placeholder
      HOUSTON_ENABLE_API_DOCS: "0"
      POSTGRES_DB: houston
      POSTGRES_USER: houston
      POSTGRES_PASSWORD: houston
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      HOUSTON_AI_OBSERVATION_PROVIDER: fake
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.16"
      - name: Install backend dependencies
        run: uv sync
      # GATE-01: mirror Makefile backend-check contract gates (local dev uses make/Docker).
      - name: Django system check
        working-directory: apps/api
        run: uv run python manage.py check
      - name: Django deploy check
        working-directory: apps/api
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: deploy-check-secret-with-sufficient-length-and-entropy
          DJANGO_ALLOWED_HOSTS: example.railway.app
          CSRF_TRUSTED_ORIGINS: https://example.railway.app
          HOUSTON_AUTH_TOKEN_PEPPER: deploy-check-pepper-distinct
          HOUSTON_AUTH_TOKEN_SALT: deploy-check-auth-salt
          HOUSTON_CHAT_WS_TICKET_SALT: deploy-check-chat-salt
          HOUSTON_REALTIME_WS_TICKET_SALT: deploy-check-realtime-salt
          OPENAI_API_KEY: sk-deploy-check
          HOUSTON_PRIVATE_MEDIA_ROOT: /tmp/houston-deploy-check-media
        run: uv run python manage.py check --deploy
      - name: Check migrations
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Lint backend
        working-directory: apps/api
        run: uv run ruff check .
      - name: Generate OpenAPI schema
        working-directory: apps/api
        env:
          HOUSTON_ENABLE_API_DOCS: "1"
        run: uv run python manage.py spectacular --file schema.yml
      - name: Verify schema.yml is committed
        run: git diff --exit-code apps/api/schema.yml
      - name: Run backend tests
        working-directory: apps/api
        run: uv run pytest -m "not openai_observation_smoke and not openai_smoke and not slow" -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Generate frontend API types
        working-directory: apps/web
        run: npm run api:generate
      - name: Verify types.ts is committed
        run: git diff --exit-code apps/web/src/api/generated/types.ts
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck
      # GATE-01: mirror Makefile web-build (make verify web-check slice).
      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Documentation drift check
        run: python scripts/docs_check.py
