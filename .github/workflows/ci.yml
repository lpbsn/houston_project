name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect path changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          resolve_base() {
            local base="$1"
            local head="$2"
            if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
              git rev-parse "${head}^" 2>/dev/null || true
            else
              echo "$base"
            fi
          }

          BASE="$(resolve_base "$BASE_SHA" "$HEAD_SHA")"
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            {
              echo "backend=true"
              echo "frontend=true"
              echo "docs=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          may_affect_api_schema() {
            local path="$1"
            case "$path" in
              apps/api/schema.yml|apps/web/src/api/generated/types.ts)
                return 0
                ;;
            esac
            if [[ "$path" =~ ^apps/api/config/ ]]; then
              return 0
            fi
            if [[ "$path" =~ ^apps/api/houston/[^/]+/api/ ]]; then
              return 0
            fi
            if [[ "$path" =~ ^apps/api/houston/.*/urls\.py$ ]]; then
              return 0
            fi
            if [[ "$path" =~ ^apps/api/houston/.*/serializers\.py$ ]]; then
              return 0
            fi
            if [[ "$path" =~ ^apps/api/houston/.*/views\.py$ ]]; then
              return 0
            fi
            if [[ "$path" =~ ^apps/api/houston/.*/authentication\.py$ ]]; then
              return 0
            fi
            return 1
          }

          is_root_config() {
            local path="$1"
            [[ "$path" != */* ]] || return 1
            case "$path" in
              pyproject.toml|uv.lock|.dockerignore|.gitignore|.env.example|.env.prod-test.example|.python-version)
                return 0
                ;;
            esac
            return 1
          }

          classify_changed_path() {
            local path="$1"
            local matched=false

            if may_affect_api_schema "$path"; then
              backend=true
              frontend=true
              return
            fi

            case "$path" in
              Makefile|infra/*|docker-compose*.yml|.github/workflows/*)
                backend=true
                frontend=true
                docs=true
                matched=true
                ;;
              apps/api/*)
                backend=true
                matched=true
                ;;
              apps/web/*|contracts/*)
                frontend=true
                matched=true
                ;;
              docs/*|scripts/docs_check.py|scripts/agent_config_check.py|.cursor/*|AGENTS.md)
                docs=true
                matched=true
                ;;
            esac

            if [ "$matched" = false ] && is_root_config "$path"; then
              backend=true
              frontend=true
              docs=true
              matched=true
            fi

            if [ "$matched" = false ]; then
              backend=true
              frontend=true
              docs=true
            fi
          }

          CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA")"
          backend=false
          frontend=false
          docs=false

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            classify_changed_path "$path"
          done <<< "$CHANGED"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

  backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: houston
          POSTGRES_USER: houston
          POSTGRES_PASSWORD: houston
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U houston -d houston"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ci.example.test,localhost,127.0.0.1,testserver
      HOUSTON_CLIENT_ORIGINS: https://ci.example.test
      HOUSTON_AUTH_TOKEN_PEPPER: ci-auth-token-pepper-distinct
      HOUSTON_AUTH_TOKEN_SALT: ci-auth-token-salt
      HOUSTON_CHAT_WS_TICKET_SALT: ci-chat-ws-ticket-salt
      HOUSTON_REALTIME_WS_TICKET_SALT: ci-realtime-ws-ticket-salt
      OPENAI_API_KEY: sk-ci-placeholder
      HOUSTON_ENABLE_API_DOCS: "0"
      POSTGRES_DB: houston
      POSTGRES_USER: houston
      POSTGRES_PASSWORD: houston
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      HOUSTON_AI_OBSERVATION_PROVIDER: fake
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.16"
      - name: Install backend dependencies
        run: uv sync
      # GATE-01: mirror Makefile backend-check contract gates (local dev uses make/Docker).
      - name: Django system check
        working-directory: apps/api
        run: uv run python manage.py check
      - name: Django deploy check
        working-directory: apps/api
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: deploy-check-secret-with-sufficient-length-and-entropy
          DJANGO_ALLOWED_HOSTS: example.railway.app
          HOUSTON_CLIENT_ORIGINS: https://example.railway.app
          HOUSTON_AUTH_TOKEN_PEPPER: deploy-check-pepper-distinct
          HOUSTON_AUTH_TOKEN_SALT: deploy-check-auth-salt
          HOUSTON_CHAT_WS_TICKET_SALT: deploy-check-chat-salt
          HOUSTON_REALTIME_WS_TICKET_SALT: deploy-check-realtime-salt
          OPENAI_API_KEY: sk-deploy-check
          HOUSTON_PRIVATE_MEDIA_ROOT: /tmp/houston-deploy-check-media
        run: uv run python manage.py check --deploy
      - name: Check migrations
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Lint backend
        working-directory: apps/api
        run: uv run ruff check .
      - name: Generate OpenAPI schema
        working-directory: apps/api
        env:
          HOUSTON_ENABLE_API_DOCS: "1"
        run: uv run python manage.py spectacular --file schema.yml
      - name: Verify schema.yml is committed
        run: git diff --exit-code apps/api/schema.yml
      - name: Run backend tests
        working-directory: apps/api
        run: uv run pytest -m "not openai_observation_smoke and not openai_smoke and not slow" -q

  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Generate frontend API types
        working-directory: apps/web
        run: npm run api:generate
      - name: Verify types.ts is committed
        run: git diff --exit-code apps/web/src/api/generated/types.ts
      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck frontend
        working-directory: apps/web
        run: npm run typecheck
      # GATE-01: typecheck (tsc -b) once; build:bundle is vite-only (no second tsc -b).
      - name: Build frontend bundle
        working-directory: apps/web
        run: npm run build:bundle
      - name: Build native frontend bundle
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: https://api.example.test
        run: npm run build:native

  docs-check:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Documentation drift check
        run: python scripts/docs_check.py
      - name: Agent config check
        run: python scripts/agent_config_check.py
