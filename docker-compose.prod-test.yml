# Local prod-test stack: same-origin gateway (port 8080) + static SPA + API.
# Railway integration (single api-web service) is PR5 — see docs/deploy/railway_static_frontend.md
#
# Usage: make up-prod-test

x-api-build: &api_build
  context: .
  dockerfile: infra/docker/api/Dockerfile

x-api-image: &api_image houston-api:prod-test

x-api-environment: &api_environment
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,gateway}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-prod-test-django-secret-change-me}
  HOUSTON_ALLOW_INSECURE_LOCAL_CSRF_ORIGINS: ${HOUSTON_ALLOW_INSECURE_LOCAL_CSRF_ORIGINS:-1}
  HOUSTON_ALLOW_LOCAL_ALLOWED_HOSTS: ${HOUSTON_ALLOW_LOCAL_ALLOWED_HOSTS:-1}
  POSTGRES_DB: ${POSTGRES_DB:-houston}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houston}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-houston}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}

  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}

  HOUSTON_REGISTRATION_INVITE_CODES: ${HOUSTON_REGISTRATION_INVITE_CODES:-}
  HOUSTON_AUTH_TOKEN_PEPPER: ${HOUSTON_AUTH_TOKEN_PEPPER:-local-prod-test-auth-pepper-distinct}
  HOUSTON_AUTH_TOKEN_SALT: ${HOUSTON_AUTH_TOKEN_SALT:-local-prod-test-auth-token-salt}
  HOUSTON_CHAT_WS_TICKET_SALT: ${HOUSTON_CHAT_WS_TICKET_SALT:-local-prod-test-chat-ws-salt}
  HOUSTON_REALTIME_WS_TICKET_SALT: ${HOUSTON_REALTIME_WS_TICKET_SALT:-local-prod-test-realtime-ws-salt}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  HOUSTON_AI_OBSERVATION_PROVIDER: ${HOUSTON_AI_OBSERVATION_PROVIDER:-openai}
  HOUSTON_AI_OBSERVATION_MODEL: ${HOUSTON_AI_OBSERVATION_MODEL:-gpt-4.1-mini}
  HOUSTON_AI_OBSERVATION_TIMEOUT_SECONDS: ${HOUSTON_AI_OBSERVATION_TIMEOUT_SECONDS:-30}
  HOUSTON_AI_OBSERVATION_MAX_RETRIES: ${HOUSTON_AI_OBSERVATION_MAX_RETRIES:-2}

services:
  gateway:
    image: nginx:1.27-alpine
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:80"
    volumes:
      - ./infra/docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web-static:
        condition: service_started

  web-static:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: production
    security_opt:
      - no-new-privileges:true

  api:
    image: *api_image
    build: *api_build
    command: ["/app/infra/docker/api/entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api_environment
    volumes:
      - private_media:/app/apps/api/private_media
    healthcheck:
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request\nurl = 'http://127.0.0.1:8000/api/v1/health/'\nwith urllib.request.urlopen(url, timeout=3) as resp:\n    if resp.status != 200:\n        raise SystemExit(1)\n    resp.read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-houston}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houston}
      POSTGRES_USER: ${POSTGRES_USER:-houston}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  private_media:
