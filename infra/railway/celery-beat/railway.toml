# Houston celery-beat — Railway prod-test V1 (mandatory)
# Wiring: Root Directory /, Config File /infra/railway/celery-beat/railway.toml
# Mount a Railway volume at /var/lib/celerybeat (see railway_deploy_contract.md).

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/api/Dockerfile"

[deploy]
startCommand = "/opt/venv/bin/celery -A config beat -l info --scheduler celery.beat:PersistentScheduler --schedule /var/lib/celerybeat/celerybeat-schedule"