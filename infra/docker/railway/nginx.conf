worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen __PORT__;
        server_name _;

        client_max_body_size 12m;

        root /usr/share/nginx/html;
        index index.html;

        # Django / DRF / Daphne — must never fall through to SPA
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Channels / Daphne WebSocket
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Hashed Vite assets — long immutable cache
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # PWA shell — always revalidate
        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Service worker — must not be cached by the browser HTTP cache
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Workbox runtime (hashed filename changes each build)
        location ~ ^/workbox-.*\.js$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Web app manifest
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA fallback for client-side routes only
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
