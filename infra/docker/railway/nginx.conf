worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Railway edge terminates TLS and sets X-Forwarded-Proto. The sidecar
    # listens on HTTP, so $scheme is always http and must not overwrite the edge.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen __PORT__;
        server_name _;

        client_max_body_size 12m;

        root /usr/share/nginx/html;
        index index.html;

        # Django / DRF / Daphne — must never fall through to SPA
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Django Channels / Daphne WebSocket
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400;
        }

        # Hashed Vite assets — long immutable cache
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA entry — always revalidate
        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /.well-known/apple-app-site-association {
            default_type application/json;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /.well-known/assetlinks.json {
            default_type application/json;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA fallback for client-side routes only
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
