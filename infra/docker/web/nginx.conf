server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — long immutable cache.
    # ^~ keeps this prefix ahead of the static regexes below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry — always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Scanner probes (/.env, /.git/config). Exact well-known locations above win.
    location ~ /\. {
        return 404;
    }

    # Missing static files must not be rewritten to the SPA.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Extensionless client routes only
    location / {
        try_files $uri $uri/ /index.html;
    }
}
