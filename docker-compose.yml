x-api-build: &api_build
  context: .
  dockerfile: infra/docker/api/Dockerfile
  args:
    UV_SYNC_DEV: "true"

x-api-image: &api_image houston-api:dev

x-api-environment: &api_environment
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,10.0.2.2}
  HOUSTON_CLIENT_ORIGINS: ${HOUSTON_CLIENT_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,https://localhost}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-me-for-local-dev}
  POSTGRES_DB: ${POSTGRES_DB:-houston}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houston}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-houston}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
  HOUSTON_DB_CONN_MAX_AGE: ${HOUSTON_DB_CONN_MAX_AGE:-0}

  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://houston:houston@rabbitmq:5672//}

  HOUSTON_PUSH_ENABLED: ${HOUSTON_PUSH_ENABLED:-false}
  HOUSTON_FCM_SERVICE_ACCOUNT_JSON: ${HOUSTON_FCM_SERVICE_ACCOUNT_JSON:-}

  HOUSTON_AUTH_TOKEN_PEPPER: ${HOUSTON_AUTH_TOKEN_PEPPER:-}
  HOUSTON_AUTH_TOKEN_SALT: ${HOUSTON_AUTH_TOKEN_SALT:-}
  HOUSTON_CHAT_WS_TICKET_SALT: ${HOUSTON_CHAT_WS_TICKET_SALT:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  RESEND_API_KEY: ${RESEND_API_KEY:-}
  HOUSTON_INVITATION_EMAIL_FROM: ${HOUSTON_INVITATION_EMAIL_FROM:-}

  HOUSTON_AI_OBSERVATION_PROVIDER: ${HOUSTON_AI_OBSERVATION_PROVIDER:-openai}
  HOUSTON_AI_OBSERVATION_MODEL: ${HOUSTON_AI_OBSERVATION_MODEL:-gpt-4.1-mini}
  HOUSTON_AI_OBSERVATION_TIMEOUT_SECONDS: ${HOUSTON_AI_OBSERVATION_TIMEOUT_SECONDS:-30}

  HOUSTON_AI_ANALYTICS_PATTERN_PROVIDER: ${HOUSTON_AI_ANALYTICS_PATTERN_PROVIDER:-openai}
  HOUSTON_AI_ANALYTICS_PATTERN_MODEL: ${HOUSTON_AI_ANALYTICS_PATTERN_MODEL:-gpt-5-mini}
  
services:
  api:
    image: *api_image
    build: *api_build
    command: ["/app/infra/docker/api/entrypoint.sh"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api_environment
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - private_media:/app/apps/api/private_media

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: houston
      RABBITMQ_DEFAULT_PASS: houston
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  celery-ai-interactive:
    image: *api_image
    build: *api_build
    security_opt:
      - no-new-privileges:true
    command:
      [
        "sh",
        "-c",
        "exec uv run celery -A config worker -l info -n houston-ai-interactive@%h -Q ai_interactive --prefetch-multiplier=1 --concurrency \"$${CELERY_WORKER_CONCURRENCY:-2}\"",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *api_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_AI_INTERACTIVE_CONCURRENCY:-2}
    volumes:
      - .:/app
      - private_media:/app/apps/api/private_media

  celery-operational:
    image: *api_image
    build: *api_build
    security_opt:
      - no-new-privileges:true
    command:
      [
        "sh",
        "-c",
        "exec uv run celery -A config worker -l info -n houston-operational@%h -Q operational --concurrency \"$${CELERY_WORKER_CONCURRENCY:-1}\"",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *api_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_OPERATIONAL_CONCURRENCY:-1}
    volumes:
      - .:/app
      - private_media:/app/apps/api/private_media

  celery-background:
    image: *api_image
    build: *api_build
    security_opt:
      - no-new-privileges:true
    command:
      [
        "sh",
        "-c",
        "exec uv run celery -A config worker -l info -n houston-background@%h -Q ai_background,maintenance --concurrency \"$${CELERY_WORKER_CONCURRENCY:-1}\"",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *api_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_BACKGROUND_CONCURRENCY:-1}
    volumes:
      - .:/app
      - private_media:/app/apps/api/private_media

  celery-beat:
    profiles:
      - scheduler
    image: *api_image
    build: *api_build
    security_opt:
      - no-new-privileges:true
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "config",
        "beat",
        "-l",
        "info",
        "--scheduler",
        "celery.beat:PersistentScheduler",
        "--schedule",
        "/var/lib/celerybeat/celerybeat-schedule",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: *api_environment
    volumes:
      - .:/app
      - celerybeat_data:/var/lib/celerybeat

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-houston}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houston}
      POSTGRES_USER: ${POSTGRES_USER:-houston}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  web_node_modules:
  private_media:
  celerybeat_data:
  rabbitmq_data:
