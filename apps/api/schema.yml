  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Logs in with an email or username identifier. Cookie transport
        requires Django CSRF and returns the refresh token only as an HttpOnly cookie.
        Body transport omits cookies and returns the refresh token in JSON.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
