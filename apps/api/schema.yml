          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Revokes the current session, preferring a valid bearer access token.
        Cookie transport requires CSRF and may fall back to and clear its refresh
        cookie. Body transport may fall back to its explicit refresh token and never
        consults or modifies cookies.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: Session revoked; cookie cleared only for cookie transport.
